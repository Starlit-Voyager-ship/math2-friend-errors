<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>朋友错题 · 做题版</title>
  <meta name="description" content="朋友的考研数学二错题清单，按知识点和题型整理。" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='5' fill='%231f5c6e'/%3E%3Ctext x='22' y='29' font-family='Microsoft YaHei,sans-serif' font-size='18' font-weight='600' fill='%23ffffff' text-anchor='middle'%3E%E9%94%99%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="study.css?v=20261120h" />
  <link rel="stylesheet" href="readable.css?v=20261120p" />
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <div class="title-row">
          <h1>朋友错题</h1>
          <span class="badge">朋友版</span>
        </div>
        <p>2015—2020 · 92 道 · 按知识点和题型整理；证明题单列。</p>
      </div>
      <div class="stats" id="stats" aria-label="题目统计"></div>
    </header>

    <nav class="tabs" id="tabs" aria-label="分类方式"></nav>

    <section class="controls" aria-label="筛选">
      <label class="sr-only" for="filterYear">年份</label>
      <select id="filterYear"></select>
      <label class="sr-only" for="filterChapter">章节</label>
      <select id="filterChapter"></select>
      <label class="sr-only" for="filterSearch">搜索</label>
      <input id="filterSearch" type="search" placeholder="搜题号、知识点、题干" autocomplete="off" />
    </section>

    <div class="result-row">
      <p class="result-count" id="resultCount"></p>
      <div class="result-tools">
        <label class="undone-toggle"><input id="onlyUndone" type="checkbox" /> 只看未完成</label>
        <button class="reset-link" id="resetDone" type="button">重置标记</button>
      </div>
    </div>

    <details class="daily">
      <summary>今天复习 <b id="todayReviewed">0</b> 题 <span>· 每日记录</span></summary>
      <div class="daily-list" id="dailyList"></div>
    </details>

    <div id="list"></div>

    <footer class="page-foot">
      <span>题干来自公开真题资料，以原卷为准。</span>
      <span id="footNote">共 <span id="totalCount">0</span> 道 · 朋友版</span>
    </footer>
  </main>

  <script>
    window.ERROR_LENS_PRACTICE = true;
    window.ERROR_LENS_SHOW_PROOF = true;
    window.ERROR_LENS_STORAGE_PREFIX = "errorLens.friend";
    window.ERROR_LENS_FOOT_LABEL = "朋友版";
    window.ERROR_LENS_EMPTY_TEXT = "朋友的错题还没导入。把题号发我，整理后这里会自动出现。";
  </script>
  <script src="friend-data.js?v=20261120t"></script>
  <script src="vendor/katex/katex.min.js"></script>
  <script src="vendor/katex/contrib/auto-render.min.js"></script>
  <script src="study.js?v=20261120s"></script>
</body>
</html>
